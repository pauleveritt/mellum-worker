[project]
name = "mellum-worker-learning-center"
version = "0.0.0"
description = "Learner workspace for the Mellum Learning Center"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.pytest.ini_options]
norecursedirs = ["fixtures", ".git", ".venv", "node_modules"]

[dependency-groups]
# The Learning Center build: `uv run zensical build`. zensical-glossary must be
# importable by the interpreter that zensical re-launches, which `uvx --with`
# could not supply to `zensical serve`.
dev = [
  "zensical",
  "zensical-glossary",
]

[tool.mellum]
model = "JetBrains/Mellum2.1-12B-A2.5B-Thinking-GGUF:Q4_K_M"
context = 50000
max_tokens = 16384
temperature = 1.0
top_p = 0.95
top_k = 20
