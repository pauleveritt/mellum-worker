[project]
site_name = "Small AI Learning Center"
site_url = "https://pauleveritt.github.io/mellum-worker/"
site_description = "Small coding models, measured: problems, fixes, evidence."
repo_url = "https://github.com/andrevanzuydam/mellum-worker"
docs_dir = "learn"
site_dir = "site"
exclude_docs = "code/"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/badges.js"]
nav = [
  { "Home" = "index.md" },
  { "Introduction" = "introduction/index.md" },
  { "Getting Started" = ["getting-started/index.md", "getting-started/base-pi-on-llamacpp.md",
    "getting-started/working-with-pi.md", "getting-started/eval-suites.md", "getting-started/the-harness.md",
    "getting-started/extensions.md", "getting-started/troubleshoot.md"] },
  { "Lessons" = ["lessons/index.md"] },
  { "The Challenge" = "challenge/index.md" },
  { "Pathologies" = "pathologies.md" },
  { "Scoreboard" = "scoreboard.md" },
  { "Glossary" = "glossary.md" },
  { "About" = [
    "about/index.md", "about/how-to-read.md",
    "about/evidence.md", "about/contributing.md",
    { "Project" = ["project/index.md", "project/toolchain.md"] },
    { "Lesson Template" = "lesson-template.md" },
    "credits.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.markdown_extensions.zensical_glossary]
glossary_file = "glossary.md"
heading_level = 3
first_only = true
base_url = "/mellum-worker/glossary/"
